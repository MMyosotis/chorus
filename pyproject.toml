[project]
name = "chorus"
version = "0.1.0"
description = "多智能体爆款图文博文创作助手"
requires-python = ">=3.9"
dependencies = [
    "openai>=2.44.0",
    "httpx[socks]>=0.28.1",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "mistune>=3.3,<4",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.13.4",
    "uuid6>=2025.0.1",
    "sqlalchemy>=2.0.51",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
